name: Build Windows and Debian binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Compile and package standalone binaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install UI dependencies
        run: npm ci
      - name: Build embedded Web UI
        run: npm run build:standalone

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test Go backend
        run: go test ./...

      - name: Cross-compile Windows and Debian
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/windows-amd64 tmp/linux-amd64 tmp/linux-arm64 release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags standalone -trimpath -ldflags="-s -w" -o tmp/windows-amd64/cctv-sub.exe ./cmd/cctv-sub
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags standalone -trimpath -ldflags="-s -w" -o tmp/linux-amd64/cctv-sub ./cmd/cctv-sub
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags standalone -trimpath -ldflags="-s -w" -o tmp/linux-arm64/cctv-sub ./cmd/cctv-sub
          file tmp/windows-amd64/cctv-sub.exe tmp/linux-amd64/cctv-sub tmp/linux-arm64/cctv-sub
          (cd tmp/windows-amd64 && zip -q ../../release/cctv-sub-windows-amd64.zip cctv-sub.exe)
          tar -C tmp/linux-amd64 -czf release/cctv-sub-linux-amd64.tar.gz cctv-sub
          tar -C tmp/linux-arm64 -czf release/cctv-sub-linux-arm64.tar.gz cctv-sub

          version="1.0.0+git${GITHUB_SHA:0:7}"
          for arch in amd64 arm64; do
            root="tmp/deb-${arch}"
            mkdir -p "${root}/DEBIAN" "${root}/usr/bin"
            install -m 0755 "tmp/linux-${arch}/cctv-sub" "${root}/usr/bin/cctv-sub"
            cat > "${root}/DEBIAN/control" <<EOF
          Package: cctv-sub
          Version: ${version}
          Section: video
          Priority: optional
          Architecture: ${arch}
          Depends: ffmpeg, ca-certificates
          Maintainer: CCTV Sub maintainers <noreply@github.com>
          Description: CCTV subscription downloader with embedded Web UI
           Self-hosted CCTV subscription downloader, API, SQLite, and Web manager.
          EOF
            dpkg-deb --build "${root}" "release/cctv-sub_${version}_${arch}.deb"
          done

      - name: Smoke-test standalone server and Web UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cctv-smoke"
          ./tmp/linux-amd64/cctv-sub -addr 127.0.0.1:18080 -data "${RUNNER_TEMP}/cctv-smoke/data" -downloads "${RUNNER_TEMP}/cctv-smoke/downloads" > "${RUNNER_TEMP}/cctv-smoke/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health -o "${RUNNER_TEMP}/cctv-smoke/health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/cctv-smoke/server.log"
            exit 1
          fi
          grep -q '"database":true' "${RUNNER_TEMP}/cctv-smoke/health.json"
          curl --fail --silent http://127.0.0.1:18080/ -o "${RUNNER_TEMP}/cctv-smoke/index.html"
          grep -q 'CCTV 自动追剧' "${RUNNER_TEMP}/cctv-smoke/index.html"
          curl --fail --silent http://127.0.0.1:18080/favicon.svg -o "${RUNNER_TEMP}/cctv-smoke/favicon.svg"
          test -s "${RUNNER_TEMP}/cctv-smoke/favicon.svg"

      - name: Upload Windows and Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: cctv-sub-windows-debian
          path: release/*
          if-no-files-found: error

      - name: Retain only the two latest successful build runs
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentId = context.runId;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: "build-binaries.yml", per_page: 100 },
              (response) => response.data.workflow_runs
            );
            const successfulPrevious = runs
              .filter(run => run.id !== currentId && run.status === "completed" && run.conclusion === "success")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at) || b.id - a.id)[0];
            const keep = new Set([currentId]);
            if (successfulPrevious) keep.add(successfulPrevious.id);
            core.info(`Retaining run IDs: ${[...keep].join(", ")}`);
            for (const run of runs) {
              if (run.status !== "completed" || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted old completed build run ${run.id}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
