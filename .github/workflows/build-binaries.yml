name: Build Windows and Debian binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  native-helper:
    name: Build independent H5E helper on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-latest
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Fetch pinned GPL-3.0 native decoder source
        uses: actions/checkout@v4
        with:
          repository: letr007/CCTVVideoDownloader
          ref: 1362fdbdbc9f2a5d523381606fcb31fc4183d0e4
          persist-credentials: false
          path: h5e-upstream
      - name: Build standalone Linux helper with static dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-out/source
          g++ -std=c++17 -O2 -static -DCCTV_H5E_CLI \
            -o native-out/cctv-h5e-decrypt \
            h5e-upstream/src/core/src/crypto/cctv_h5e_decrypt.cpp
          chmod 755 native-out/cctv-h5e-decrypt
          cp h5e-upstream/src/core/src/crypto/cctv_h5e_decrypt.{hpp,cpp} native-out/source/
          cp h5e-upstream/LICENSE native-out/GPL-3.0-LICENSE
          file native-out/cctv-h5e-decrypt
      - name: Enable MSVC build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build standalone Windows helper (static runtime)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Type Directory -Force native-out/source | Out-Null
          cl.exe /nologo /O2 /MT /EHsc /std:c++17 /DCCTV_H5E_CLI /Fe:native-out/cctv-h5e-decrypt.exe h5e-upstream/src/core/src/crypto/cctv_h5e_decrypt.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item h5e-upstream/src/core/src/crypto/cctv_h5e_decrypt.hpp native-out/source/
          Copy-Item h5e-upstream/src/core/src/crypto/cctv_h5e_decrypt.cpp native-out/source/
          Copy-Item h5e-upstream/LICENSE native-out/GPL-3.0-LICENSE
          if (-not (Test-Path native-out/cctv-h5e-decrypt.exe)) { exit 1 }
      - name: Upload GPL helper with complete corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Compile and package standalone binaries
    needs: native-helper
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install UI dependencies
        run: npm ci
      - name: Build embedded Web UI
        run: npm run build:standalone

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test Go backend
        run: go test ./...
      - name: Race-test parallel HLS downloads
        run: go test -race ./internal/service ./internal/store

      - name: Retrieve independently built Windows GPL helper
        uses: actions/download-artifact@v4
        with:
          name: native-windows-amd64
          path: tmp/windows-amd64
      - name: Retrieve independently built Linux x64 GPL helper
        uses: actions/download-artifact@v4
        with:
          name: native-linux-amd64
          path: tmp/linux-amd64
      - name: Retrieve independently built Linux ARM64 GPL helper
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: tmp/linux-arm64

      - name: Cross-compile Windows and Debian
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/windows-amd64 tmp/linux-amd64 tmp/linux-arm64 release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags standalone -trimpath -ldflags="-s -w -X cctv-sub/internal/server.BuildRevision=${GITHUB_SHA}" -o tmp/windows-amd64/cctv-sub.exe ./cmd/cctv-sub
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags standalone -trimpath -ldflags="-s -w -X cctv-sub/internal/server.BuildRevision=${GITHUB_SHA}" -o tmp/linux-amd64/cctv-sub ./cmd/cctv-sub
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags standalone -trimpath -ldflags="-s -w -X cctv-sub/internal/server.BuildRevision=${GITHUB_SHA}" -o tmp/linux-arm64/cctv-sub ./cmd/cctv-sub
          file tmp/windows-amd64/cctv-sub.exe tmp/linux-amd64/cctv-sub tmp/linux-arm64/cctv-sub
          test -s tmp/windows-amd64/cctv-h5e-decrypt.exe
          chmod 755 tmp/linux-amd64/cctv-h5e-decrypt tmp/linux-arm64/cctv-h5e-decrypt
          (cd tmp/windows-amd64 && zip -qr ../../release/cctv-sub-windows-amd64.zip cctv-sub.exe cctv-h5e-decrypt.exe GPL-3.0-LICENSE source)
          tar -C tmp/linux-amd64 -czf release/cctv-sub-linux-amd64.tar.gz cctv-sub cctv-h5e-decrypt GPL-3.0-LICENSE source
          tar -C tmp/linux-arm64 -czf release/cctv-sub-linux-arm64.tar.gz cctv-sub cctv-h5e-decrypt GPL-3.0-LICENSE source

          version="1.0.0+git${GITHUB_SHA:0:7}"
          for arch in amd64 arm64; do
            root="tmp/deb-${arch}"
            mkdir -p "${root}/DEBIAN" "${root}/usr/bin" "${root}/usr/lib/cctv-sub" "${root}/usr/share/doc/cctv-sub/h5e-source"
            install -m 0755 "tmp/linux-${arch}/cctv-sub" "${root}/usr/bin/cctv-sub"
            install -m 0755 "tmp/linux-${arch}/cctv-h5e-decrypt" "${root}/usr/lib/cctv-sub/cctv-h5e-decrypt"
            install -m 0644 "tmp/linux-${arch}/GPL-3.0-LICENSE" "${root}/usr/share/doc/cctv-sub/GPL-3.0-LICENSE"
            install -m 0644 "tmp/linux-${arch}/source/"* "${root}/usr/share/doc/cctv-sub/h5e-source/"
            cat > "${root}/DEBIAN/control" <<EOF
          Package: cctv-sub
          Version: ${version}
          Section: video
          Priority: optional
          Architecture: ${arch}
          Depends: ffmpeg, ca-certificates
          Maintainer: CCTV Sub maintainers <noreply@github.com>
          Description: CCTV subscription downloader with embedded Web UI
           Self-hosted CCTV subscription downloader, API, SQLite, and Web manager.
          EOF
            dpkg-deb --build --root-owner-group "${root}" "release/cctv-sub_${version}_${arch}.deb"
          done

      - name: Smoke-test standalone server and Web UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cctv-smoke"
          ./tmp/linux-amd64/cctv-sub -addr 127.0.0.1:18080 -data "${RUNNER_TEMP}/cctv-smoke/data" -downloads "${RUNNER_TEMP}/cctv-smoke/downloads" > "${RUNNER_TEMP}/cctv-smoke/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health -o "${RUNNER_TEMP}/cctv-smoke/health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/cctv-smoke/server.log"
            exit 1
          fi
          grep -q '"database":true' "${RUNNER_TEMP}/cctv-smoke/health.json"
          grep -q "${GITHUB_SHA}" "${RUNNER_TEMP}/cctv-smoke/health.json"
          curl --fail --silent http://127.0.0.1:18080/ -o "${RUNNER_TEMP}/cctv-smoke/index.html"
          grep -q 'CCTV 自动追剧' "${RUNNER_TEMP}/cctv-smoke/index.html"
          curl --fail --silent http://127.0.0.1:18080/favicon.svg -o "${RUNNER_TEMP}/cctv-smoke/favicon.svg"
          test -s "${RUNNER_TEMP}/cctv-smoke/favicon.svg"
          test -x ./tmp/linux-amd64/cctv-h5e-decrypt
          test -s ./tmp/windows-amd64/cctv-h5e-decrypt.exe

      - name: Upload Windows and Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: cctv-sub-windows-debian
          path: release/*
          if-no-files-found: error

      - name: Retain only the two latest successful build runs
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentId = context.runId;
            const runs = [];
            for (let page = 1; ; page++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "build-binaries.yml", per_page: 100, page
              });
              const batch = response.data.workflow_runs;
              if (!Array.isArray(batch)) throw new Error("Unexpected workflow runs API response");
              runs.push(...batch);
              if (batch.length < 100) break;
            }
            const successfulPrevious = runs
              .filter(run => run.id !== currentId && run.status === "completed" && run.conclusion === "success")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at) || b.id - a.id)[0];
            const keep = new Set([currentId]);
            if (successfulPrevious) keep.add(successfulPrevious.id);
            core.info(`Retaining run IDs: ${[...keep].join(", ")}`);
            for (const run of runs) {
              if (run.status !== "completed" || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted old completed build run ${run.id}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
