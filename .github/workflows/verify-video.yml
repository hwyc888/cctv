name: Verify real CCTV video decryption

on:
  push:
    paths:
      - internal/service/video_visual_integration_test.go
      - .github/workflows/verify-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Check FFmpeg on Ubuntu 24.04 runner
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Check alternative CCTV HLS sources
        env:
          CCTV_INTEGRATION: "1"
          CCTV_FFMPEG_PATH: /usr/bin/ffmpeg
          CCTV_FFPROBE_PATH: /usr/bin/ffprobe
        run: go test ./internal/service -run TestCCTVStreamCandidatesDecodeIntegration -count=1 -v -timeout 5m
      - name: Decode and verify real CCTV HLS video frames
        env:
          CCTV_VISUAL_INTEGRATION: "1"
          CCTV_VISUAL_OUTPUT: /tmp/cctv-video-check
        run: go test ./internal/service -run TestLiveVideoVisualDecode -count=1 -v -timeout 8m
      - name: Upload actual decoded frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cctv-decode-check
          path: /tmp/cctv-video-check/*.png
          if-no-files-found: ignore
          retention-days: 1
