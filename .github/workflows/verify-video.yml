name: Inspect real CCTV video decryption

on:
  push:
    paths:
      - internal/service/video_visual_integration_test.go
      - .github/workflows/verify-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Capture short original and processed video stream samples
        env:
          CCTV_VISUAL_INTEGRATION: "1"
          CCTV_VISUAL_COLLECT_ONLY: "1"
          CCTV_VISUAL_OUTPUT: /tmp/cctv-video-check
        run: go test ./internal/service -run TestLiveVideoVisualDecode -count=1 -v -timeout 8m
      - name: Upload video diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctv-video-diagnostics
          path: /tmp/cctv-video-check/*.ts
          if-no-files-found: error
          retention-days: 1
