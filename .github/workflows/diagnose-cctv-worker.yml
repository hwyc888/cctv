name: Diagnose CCTV player source

on:
  push:
    paths:
      - .github/workflows/diagnose-cctv-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public CCTV worker JavaScript structure
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, urllib.error
          urls = [
              "https://player.cntv.cn/h5vod/cctv.worker.js",
              "https://js.player.cntv.cn/h5vod/cctv.worker.js",
              "https://js.player.cntv.cn/creator/cctv.worker.js",
              "https://player.cntv.cn/h5vod/h5.worker.js",
          ]
          markers = [b"wasmBinaryFile", b"base64,", b"__ATPRERUN__.push(function(){", b";var A=[];A=", b"HEAPU8.set(", b"cctv.worker"]
          for url in urls:
              print("\nURL", url, flush=True)
              try:
                  req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0", "Referer":"https://tv.cctv.com/", "Accept":"*/*"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data=response.read(12_000_000)
                      print("status", response.status, "final", response.url, "content_type", response.headers.get("Content-Type"),
                          "length",len(data),"sha256",hashlib.sha256(data).hexdigest(), flush=True)
                      print("prefix",repr(data[:200]),flush=True)
                      for marker in markers:
                          ix=data.find(marker)
                          print("marker", marker.decode("ascii"), "offset", ix, "occurrences",data.count(marker),flush=True)
                          if ix>=0:
                              print("context",repr(data[max(0,ix-100):ix+160]),flush=True)
              except Exception as err:
                  print("ERROR",type(err).__name__,str(err),flush=True)
          PY

      - name: Download current player module for compatibility analysis
        shell: bash
        run: |
          mkdir -p inspector
          curl --fail --show-error --silent --location --retry 2 "https://player.cntv.cn/h5vod/cctv.worker.js" -o inspector/cctv.worker.js
          test "$(wc -c < inspector/cctv.worker.js)" -gt 100000
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test live CCTV WASM initialization in pure Go
        run: go test ./internal/cctvwasm -run TestOfficialModuleStartsWithoutBrowser -count=1 -v -timeout 4m
        env:
          CCTV_WASM_SOURCE: inspector/cctv.worker.js
      - name: Upload public player module for debugging
        uses: actions/upload-artifact@v4
        with:
          name: public-cctv-worker-source
          path: inspector/cctv.worker.js
          retention-days: 1
          if-no-files-found: error
