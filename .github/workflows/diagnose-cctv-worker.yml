name: Diagnose CCTV player source

on:
  push:
    paths:
      - .github/workflows/diagnose-cctv-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public CCTV worker JavaScript structure
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, urllib.error
          urls = [
              "https://player.cntv.cn/h5vod/cctv.worker.js",
              "https://js.player.cntv.cn/h5vod/cctv.worker.js",
              "https://js.player.cntv.cn/creator/cctv.worker.js",
              "https://player.cntv.cn/h5vod/h5.worker.js",
          ]
          markers = [b"wasmBinaryFile", b"base64,", b"__ATPRERUN__.push(function(){", b";var A=[];A=", b"HEAPU8.set(", b"cctv.worker"]
          for url in urls:
              print("\nURL", url, flush=True)
              try:
                  req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0", "Referer":"https://tv.cctv.com/", "Accept":"*/*"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data=response.read(12_000_000)
                      print("status", response.status, "final", response.url, "content_type", response.headers.get("Content-Type"),
                          "length",len(data),"sha256",hashlib.sha256(data).hexdigest(), flush=True)
                      print("prefix",repr(data[:200]),flush=True)
                      for marker in markers:
                          ix=data.find(marker)
                          print("marker", marker.decode("ascii"), "offset", ix, "occurrences",data.count(marker),flush=True)
                          if ix>=0:
                              print("context",repr(data[max(0,ix-100):ix+160]),flush=True)
              except Exception as err:
                  print("ERROR",type(err).__name__,str(err),flush=True)
          PY
